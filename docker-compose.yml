# Reqlore — UI + MITM proxy in a single container.
#
# Usage:
#   docker compose up --build
#   then point your browser at  http://127.0.0.1:8787
#   and set its HTTP proxy to   127.0.0.1:8080
#
# The project file lives in ./data/my.rlr on the host. On first run the
# `init` service creates it; subsequent `up`s reuse it.

services:
  init:
    build: .
    image: reqlore:latest
    command: ["init", "/data/my.rlr"]
    volumes:
      - ./data:/data
    restart: "no"

  reqlore:
    image: reqlore:latest
    depends_on:
      init:
        condition: service_completed_successfully
    command:
      - "both"
      - "--project"
      - "/data/my.rlr"
      - "--host"
      - "0.0.0.0"
      - "--ui-port"
      - "8787"
      - "--proxy-port"
      - "8080"
      - "--unsafe-bind"
    ports:
      # Pinned to loopback on the host: container binds 0.0.0.0 (needed for the
      # port forward) but the listener is still only reachable from your box.
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="title desc">
  <title id="title">Reqlore</title>
  <desc id="desc">Hexagonal pentest shield containing two arrows converging on a captured insight node.</desc>

  <!-- Hex shield: a security tool convention, rendered with rounded joins for warmth -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18"
           fill="none" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Left arm of the W: an arrow descending and folding inward -->
  <path d="M 16 20 L 24 44 L 30.5 31"
        fill="none" stroke="#0F172A" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right arm of the W: mirrored, converging on the same point -->
  <path d="M 48 20 L 40 44 L 33.5 31"
        fill="none" stroke="#0F172A" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The "lore": the inspected request, surfaced as a warm amber node -->
  <circle cx="32" cy="29.5" r="4" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
</svg>

{% extends "base.html" %}
{% block title %}Reqlore — New WebSocket conversation{% endblock %}
{% block main %}
<h1>New WebSocket conversation</h1>

{% if not ws_available %}
  <p><strong>WebSocket support not available.</strong> Install
     <code>pip install websockets</code> and reload.</p>
{% endif %}

<form method="post" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <p>
    <label for="url">WS URL</label>
    <input id="url" name="url" type="url" required size="60"
           placeholder="wss://example.com/socket">
  </p>
  <p>
    <label for="hdr">Headers (one per line, "Name: value")</label><br>
    <textarea id="hdr" name="headers" rows="3" cols="80"></textarea>
  </p>
  <fieldset>
    <legend>First message (optional)</legend>
    <p>
      <input type="radio" id="k-text" name="kind" value="text" checked>
      <label for="k-text">Text</label>
      <input type="radio" id="k-bin" name="kind" value="binary">
      <label for="k-bin">Binary (hex)</label>
    </p>
    <p>
      <label for="d">Data</label><br>
      <textarea id="d" name="data" rows="3" cols="80"
                placeholder="hello"></textarea>
    </p>
  </fieldset>
  <p>
    <label for="rs">Read for (seconds)</label>
    <input id="rs" name="recv_seconds" type="number" value="2" step="0.5" min="0" max="60">
  </p>
  <p><button type="submit">Connect</button></p>
</form>
{% endblock %}

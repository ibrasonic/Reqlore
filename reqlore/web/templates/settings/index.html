{% extends "base.html" %}
{% block title %}Reqlore — Settings{% endblock %}
{% block main %}
<h1>Settings</h1>
<form method="post" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">

  <fieldset>
    <legend>Theme</legend>
    {% for v, label in themes %}
      <p>
        <input type="radio" id="th-{{ v }}" name="theme" value="{{ v }}"
               {% if v == current_theme %}checked{% endif %}>
        <label for="th-{{ v }}">{{ label }}</label>
      </p>
    {% endfor %}
  </fieldset>

  <fieldset>
    <legend>Verbosity</legend>
    {% for v, label in verbosities %}
      <p>
        <input type="radio" id="vb-{{ v }}" name="verbosity" value="{{ v }}"
               {% if v == current_verbosity %}checked{% endif %}>
        <label for="vb-{{ v }}">{{ label }}</label>
      </p>
    {% endfor %}
  </fieldset>

  <fieldset>
    <legend>Audio cues</legend>
    <p>
      <input type="checkbox" id="cu" name="cues" value="1" {% if cues_on %}checked{% endif %}>
      <label for="cu">Play a short tone after each action (off by default).
        Browsers may suppress autoplay until you interact with the page once.
        Preview the available cues on the <a href="{{ url_for('cues.index') }}">Cues</a> page.</label>
    </p>
  </fieldset>

  <fieldset>
    <legend>Update check (opt-in)</legend>
    <p>
      <input type="checkbox" id="upd" name="update_check" value="1" {% if update_check_on %}checked{% endif %}>
      <label for="upd">Allow Reqlore to fetch a small manifest from the
        configured release server when you press the button below. Disabled by
        default; no automatic checks happen.</label>
    </p>
  </fieldset>

  <fieldset>
    <legend>Issue consolidation</legend>
    <p>
      <input type="checkbox" id="cs-en" name="consolidation_enabled" value="1"
             {% if consolidation.enabled %}checked{% endif %}>
      <label for="cs-en">Enable post-scan consolidation. Disabled by default;
        when on, the scanner rolls up frequent same-rule findings under a
        single directory-level finding and (optionally) collapses across
        hosts that share a backend.</label>
    </p>
    <p>
      <label for="cs-path">Directory roll-up threshold (minimum distinct URLs
        before consolidation kicks in):</label>
      <input type="number" id="cs-path"
             name="consolidation_path_rollup_threshold"
             value="{{ consolidation.path_rollup_threshold }}"
             min="3" max="1000" step="1">
    </p>
    <p>
      <label for="cs-ip">Insertion-point lightweight threshold (probes
        without a fire before dropping to the cheap probe tier):</label>
      <input type="number" id="cs-ip"
             name="consolidation_ip_lightweight_threshold"
             value="{{ consolidation.ip_lightweight_threshold }}"
             min="10" max="10000" step="1">
    </p>
    <p>
      <input type="checkbox" id="cs-xh"
             name="consolidation_cross_host_enabled" value="1"
             {% if consolidation.cross_host_enabled %}checked{% endif %}>
      <label for="cs-xh">Cross-host backend dedupe. When on, findings on
        different hosts that share the same response <code>Server</code>
        header collapse into one finding.</label>
    </p>
  </fieldset>

  <button type="submit">Save</button>
</form>

<form method="post" action="{{ url_for('.check_updates') }}" style="margin-top:1rem">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <button type="submit" {% if not update_check_on %}disabled{% endif %}>Check for updates now</button>
</form>
{% endblock %}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80"
     role="img" aria-label="Weblore — accessible web pentesting">
  <title>Weblore</title>
  <desc>Weblore wordmark with tagline: accessible web pentesting.</desc>

  <!-- Icon -->
  <g transform="translate(4,8)">
    <polygon points="32,4 56,18 56,46 32,60 8,46 8,18"
             fill="none" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 16 20 L 24 44 L 30.5 31" fill="none" stroke="#0F172A" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 48 20 L 40 44 L 33.5 31" fill="none" stroke="#0F172A" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="29.5" r="4" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <text x="84" y="46"
        font-family="Inter, Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.5"
